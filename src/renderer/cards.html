<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://raw.communitydragon.org https://media.valorant-api.com; style-src 'self'; script-src 'self'; connect-src 'none'; font-src 'self'">
<title>Contas</title><link rel="stylesheet" href="../../node_modules/@fontsource/cinzel/700.css"><link rel="stylesheet" href="../../node_modules/@fontsource/teko/500.css"><link rel="stylesheet" href="../../node_modules/@fontsource/teko/600.css"><link rel="stylesheet" href="cards.css"></head><body>
<section id="status" class="status" role="status" aria-live="polite" hidden><span class="spinner"></span><p id="status-text"></p></section><p id="notice" role="status" hidden></p><main id="cards" aria-label="Contas salvas" data-t-aria="savedAccounts"></main>
<footer class="launch-bar"><div class="footer-tools"><button id="add-account" type="button" title="Adicionar conta" aria-label="Adicionar conta" data-t-title="addAccount" data-t-aria="addAccount"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"/></svg></button><button id="settings" title="Configurações" aria-label="Configurações" data-t-title="settings" data-t-aria="settings">⚙</button><p class="refresh-info"><span id="count">0 contas</span><span id="updated">nunca atualizado</span></p><button id="refresh" title="Atualizar estatísticas" aria-label="Atualizar estatísticas" data-t-title="refreshStats" data-t-aria="refreshStats">↻</button></div><nav id="games" aria-label="Jogo" data-t-aria="gamesNav"><button data-game="riot" aria-pressed="false" aria-label="Riot Client" title="Riot Client: só entrar na conta" data-t-title="riotOnly"><img src="assets/riot.png" alt=""></button><button data-game="lol" aria-pressed="true" aria-label="League of Legends" title="League of Legends"><img src="assets/lol.png" alt=""></button><button data-game="val" aria-pressed="false" aria-label="VALORANT" title="VALORANT"><img src="assets/valorant.png" alt=""></button></nav><div class="selection" aria-live="polite"><strong id="selected-name">Selecione uma conta</strong><span id="selected-game">League of Legends</span></div><button id="play" class="primary" disabled>Jogar <span aria-hidden="true">→</span></button></footer>
<div class="riot-controls"><button id="riot-minimize" class="riot-control" type="button" aria-label="Minimizar" data-t-aria="minimize"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M10 15.5h12"/></svg></button><button id="riot-close" class="riot-control riot-close" type="button" aria-label="Fechar" data-t-aria="close"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M11 7l10.5 10.5M21.5 7l-10.5 10.5"/></svg></button></div>
<dialog id="account-dialog"><form id="account-form"><header><h2 id="account-title">Adicionar conta</h2><button type="button" data-close aria-label="Fechar" data-t-aria="close">×</button></header><label><span data-t="riotId">Nome da conta (Riot ID)</span><input name="riotId" required maxlength="81" placeholder="Nome#BR1" data-t-placeholder="riotIdPlaceholder"></label><label><span data-t="username">Usuário de login</span><input name="username" required maxlength="256" autocomplete="off"></label><label><span data-t="password">Senha</span><input name="password" type="password" maxlength="256" autocomplete="new-password" placeholder="Vazio para manter ao editar" data-t-placeholder="passwordPlaceholder"></label><label><span data-t="region">Servidor</span><select name="region"></select></label><p class="form-error" role="alert"></p><footer><button type="button" id="delete-account" class="danger" data-t="removeAccount" hidden>Remover conta</button><button type="button" data-close data-t="cancel">Cancelar</button><button type="submit" class="primary" data-t="saveAccount">Salvar conta</button></footer></form></dialog>
<dialog id="settings-dialog"><form id="settings-form"><header><h2 data-t="settings">Configurações</h2><button type="button" data-close aria-label="Fechar" data-t-aria="close">×</button></header><label><span data-t="language">Idioma</span><select name="language"><option value="pt" lang="pt-BR">Português</option><option value="en" lang="en">English</option></select></label><label class="check"><input name="staySignedIn" type="checkbox"><span><span data-t="staySignedIn">Manter login</span><small data-t="staySignedInHelp">O Eclipse guarda a sessão de cada conta e entra sem digitar, em segundo plano. A Riot sempre abre na tela de login.</small></span></label><p data-t="keysHint">Campos vazios mantêm a chave atual.</p><label>Riot API (League)<input name="riotApiKey" type="password" autocomplete="new-password"></label><label>HenrikDev (VALORANT)<input name="henrikApiKey" type="password" autocomplete="new-password"></label><label><span data-t="refreshEvery">Atualizar a cada (minutos)</span><input name="refreshMinutes" type="number" min="0" max="10080"></label><p class="form-error" role="alert"></p><footer><button type="button" data-close data-t="cancel">Cancelar</button><button type="submit" class="primary" data-t="save">Salvar</button></footer></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><footer><button value="cancel" data-t="cancel">Cancelar</button><button value="confirm" class="primary" data-t="confirm">Confirmar</button></footer></form></dialog>
<script type="module" src="cards.js"></script></body></html>
