<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://raw.communitydragon.org https://media.valorant-api.com; style-src 'self'; script-src 'self'; connect-src 'none'; font-src 'self'">
<title>Contas</title><link rel="stylesheet" href="cards.css"></head><body>
<section id="status" class="status" role="status" aria-live="polite" hidden><span class="spinner"></span><p id="status-text"></p></section><p id="notice" role="status" hidden></p><main id="cards" aria-label="Contas salvas"></main>
<footer class="launch-bar"><div class="footer-tools"><button id="settings" title="Configurações" aria-label="Configurações">⚙</button><button id="refresh" title="Atualizar estatísticas"><span class="sr-only">Atualizar estatísticas: </span><span id="count">0 contas</span> · <span id="updated">nunca atualizado</span> <span aria-hidden="true">↻</span></button></div><nav id="games" aria-label="Jogo"><button data-game="lol" aria-pressed="true" aria-label="League of Legends" title="League of Legends"><img src="assets/lol.png" alt=""></button><button data-game="val" aria-pressed="false" aria-label="VALORANT" title="VALORANT"><img src="assets/valorant.png" alt=""></button></nav><div class="selection" aria-live="polite"><strong id="selected-name">Selecione uma conta</strong><span id="selected-game">League of Legends</span></div><button id="play" class="primary" disabled>Jogar <span aria-hidden="true">→</span></button></footer>
<dialog id="account-dialog"><form id="account-form"><header><h2 id="account-title">Adicionar conta</h2><button type="button" data-close aria-label="Fechar">×</button></header><label>Nome da conta (Riot ID)<input name="riotId" required maxlength="81" placeholder="Nome#BR1"></label><label>Usuário de login<input name="username" required maxlength="256" autocomplete="off"></label><label>Senha<input name="password" type="password" maxlength="256" autocomplete="new-password" placeholder="Vazio para manter ao editar"></label><label>Servidor<select name="region"></select></label><p class="form-error" role="alert"></p><footer><button type="button" id="delete-account" class="danger" hidden>Remover conta</button><button type="button" data-close>Cancelar</button><button type="submit" class="primary">Salvar conta</button></footer></form></dialog>
<dialog id="settings-dialog"><form id="settings-form"><header><h2>Configurações</h2><button type="button" data-close aria-label="Fechar">×</button></header><label class="check"><input name="staySignedIn" type="checkbox"><span>Manter login<small>A Riot lembra a conta ao reabrir o cliente. Desmarcado, o login não fica salvo.</small></span></label><p>Campos vazios mantêm a chave atual.</p><label>Riot API (League)<input name="riotApiKey" type="password" autocomplete="new-password"></label><label>HenrikDev (VALORANT)<input name="henrikApiKey" type="password" autocomplete="new-password"></label><label>Atualizar a cada (minutos)<input name="refreshMinutes" type="number" min="0" max="10080"></label><p class="form-error" role="alert"></p><footer><button type="button" data-close>Cancelar</button><button type="submit" class="primary">Salvar</button></footer></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><footer><button value="cancel">Cancelar</button><button value="confirm" class="primary">Confirmar</button></footer></form></dialog>
<script type="module" src="cards.js"></script></body></html>
