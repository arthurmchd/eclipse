<section id="status" class="status" role="status" aria-live="polite" hidden><span class="spinner"></span><p id="status-text"></p></section><p id="notice" role="status" hidden></p><div id="toolbar" class="toolbar"><label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg><input id="search" type="search" maxlength="80" autocomplete="off" spellcheck="false" placeholder="Nome ou login" aria-label="Buscar contas" data-t-placeholder="searchPlaceholder" data-t-aria="search"></label><div class="filter-menu"><button id="filters" type="button" aria-expanded="false" aria-controls="filter-panel"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg><span data-t="filters">Filtros</span><span id="filter-count" class="filter-count" hidden></span></button><div id="filter-panel" class="filter-panel" hidden><div id="filter-region-group" class="filter-group"><p class="filter-label" data-t="allRegions">Servidor</p><div id="filter-region" class="filter-chips" role="group" aria-label="Filtrar por servidor" data-t-aria="filterRegion"></div></div><div id="filter-tier-group" class="filter-group"><p class="filter-label" data-t="allTiers">Elo</p><div id="filter-tier" class="filter-chips" role="group" aria-label="Filtrar por elo" data-t-aria="filterTier"></div></div></div></div><label class="sort"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M2.5 10.5L5 13l2.5-2.5M11 13V3M8.5 5.5L11 3l2.5 2.5"/></svg><select id="sort" aria-label="Ordenar" data-t-aria="sortLabel"></select></label><button id="add-account" class="add-account" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg><span data-t="addAccount">Adicionar conta</span></button></div><div class="view-bar"><p class="refresh-info"><span id="count">0 contas</span><span aria-hidden="true">·</span><span id="updated">nunca atualizado</span></p><button id="refresh" class="icon-button" type="button" title="Atualizar estatísticas" aria-label="Atualizar estatísticas" data-t-title="refreshStats" data-t-aria="refreshStats"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M11.9 1.9v2.8H9.1"/></svg></button><div id="layout" class="layout-toggle" role="group" aria-label="Visualização das contas" data-t-aria="layoutNav"><button type="button" data-layout="plates" aria-pressed="true" title="Placas" aria-label="Placas" data-t-title="layoutPlates" data-t-aria="layoutPlates"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="5" height="11" rx="1"/><rect x="9" y="2.5" width="5" height="11" rx="1"/></svg></button><button type="button" data-layout="list" aria-pressed="false" title="Lista compacta" aria-label="Lista compacta" data-t-title="layoutList" data-t-aria="layoutList"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button></div><button id="page-theme" class="icon-button" type="button" title="Tema escuro" aria-label="Tema escuro"><svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z"/></svg><svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg></button><button id="settings" class="icon-button" type="button" title="Configurações" aria-label="Configurações" data-t-title="settings" data-t-aria="settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.83 3.14L6.87 1.50L9.13 1.50L9.17 3.14L10.61 3.74L11.80 2.60L13.40 4.20L12.26 5.39L12.86 6.83L14.50 6.87L14.50 9.13L12.86 9.17L12.26 10.61L13.40 11.80L11.80 13.40L10.61 12.26L9.17 12.86L9.13 14.50L6.87 14.50L6.83 12.86L5.39 12.26L4.20 13.40L2.60 11.80L3.74 10.61L3.14 9.17L1.50 9.13L1.50 6.87L3.14 6.83L3.74 5.39L2.60 4.20L4.20 2.60L5.39 3.74Z"/><circle cx="8" cy="8" r="2.2"/></svg></button></div><main id="cards" aria-label="Contas salvas" data-t-aria="savedAccounts"></main>
<footer class="launch-bar"><nav id="games" aria-label="Jogo" data-t-aria="gamesNav"><button type="button" data-game="lol" aria-pressed="true" aria-label="League of Legends" title="League of Legends"><img src="assets/game-lol.svg" alt=""></button><button type="button" data-game="val" aria-pressed="false" aria-label="VALORANT" title="VALORANT"><img src="assets/game-val.png" alt=""></button><button type="button" data-game="tft" aria-pressed="false" aria-label="Teamfight Tactics" title="Teamfight Tactics"><img src="assets/game-tft.svg" alt=""></button><button type="button" data-game="2xko" aria-pressed="false" aria-label="2XKO" title="2XKO"><img src="assets/game-2xko.svg" alt=""></button><button type="button" data-game="lor" aria-pressed="false" aria-label="Legends of Runeterra" title="Legends of Runeterra"><img src="assets/game-lor.png" alt=""></button><span class="games-divider" aria-hidden="true"></span><button type="button" data-game="riot" aria-pressed="false" aria-label="Riot Client" title="Riot Client: só entrar na conta" data-t-title="riotOnly"><img src="assets/riot.png" alt=""></button></nav><div class="selection" aria-live="polite"><span id="selected-label" class="selection-label" data-t="selectionLabel" hidden>Selecionada</span><strong id="selected-name">Selecione uma conta</strong><span id="selected-detail"></span></div><button id="play" class="primary" disabled>Jogar <span aria-hidden="true">→</span></button></footer>
<div class="riot-controls"><button id="riot-minimize" class="riot-control" type="button" aria-label="Minimizar" data-t-aria="minimize"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M10 15.5h12"/></svg></button><button id="riot-close" class="riot-control riot-close" type="button" aria-label="Fechar" data-t-aria="close"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M11 7l10.5 10.5M21.5 7l-10.5 10.5"/></svg></button></div>
<dialog id="account-dialog" class="account-dialog"><form id="account-form"><header><h2 id="account-title">Adicionar conta</h2><button type="button" data-close aria-label="Fechar" data-t-aria="close">×</button></header><div id="add-mode" class="mode-tabs" role="group"><button type="button" data-mode="single" aria-pressed="true" data-t="addOne">Uma conta</button><button type="button" data-mode="batch" aria-pressed="false" data-t="addMany">Várias contas</button></div><button type="button" id="use-seen" class="use-seen" hidden><img src="assets/riot.png" alt=""><span id="use-seen-text"></span></button><div class="form-grid"><label class="single-field"><span data-t="riotId">Nome da conta (Riot ID)</span><input name="riotId" autofocus required maxlength="81" placeholder="Nome#BR1" data-t-placeholder="riotIdPlaceholder"></label><label class="single-field"><span data-t="username">Usuário de login</span><input name="username" required maxlength="256" autocomplete="off"></label><label class="single-field"><span data-t="password">Senha</span><input name="password" type="password" maxlength="256" autocomplete="new-password" placeholder="Vazio para manter ao editar" data-t-placeholder="passwordPlaceholder"></label><label class="batch-field wide" hidden><span data-t="batchLabel">Uma conta por linha: Nome#TAG;usuário;senha</span><textarea name="batch" rows="6" maxlength="20000" spellcheck="false" autocomplete="off" placeholder="Nome#BR1;usuario;senha"></textarea><small data-t="batchHint">As senhas aparecem enquanto você digita e são apagadas ao fechar.</small></label><label><span data-t="region">Servidor</span><select name="region"></select></label><fieldset id="game-picks" class="wide game-picks"><legend data-t="gamesLabel">Mostrar em</legend><label class="game-pick" data-game="all"><input type="checkbox" name="gamesAll" checked><span data-t="gamesAll">Todos</span></label><label class="game-pick" data-game="lol" title="League of Legends"><input type="checkbox" name="games" value="lol" aria-label="League of Legends" checked><img src="assets/game-lol.svg" alt=""><span>LoL</span></label><label class="game-pick" data-game="val" title="VALORANT"><input type="checkbox" name="games" value="val" aria-label="VALORANT" checked><img src="assets/game-val.png" alt=""><span>VALORANT</span></label><label class="game-pick" data-game="tft" title="Teamfight Tactics"><input type="checkbox" name="games" value="tft" aria-label="Teamfight Tactics" checked><img src="assets/game-tft.svg" alt=""><span>TFT</span></label><label class="game-pick" data-game="2xko" title="2XKO"><input type="checkbox" name="games" value="2xko" aria-label="2XKO" checked><img src="assets/game-2xko.svg" alt=""><span>2XKO</span></label><label class="game-pick" data-game="lor" title="Legends of Runeterra"><input type="checkbox" name="games" value="lor" aria-label="Legends of Runeterra" checked><img src="assets/game-lor.png" alt=""><span>Runeterra</span></label></fieldset></div><p class="form-error" role="alert"></p><footer><button type="button" id="delete-account" class="danger" data-t="removeAccount" hidden>Remover conta</button><button type="button" data-close data-t="cancel">Cancelar</button><button type="submit" class="primary" data-t="saveAccount">Salvar conta</button></footer></form></dialog>
<dialog id="settings-dialog"><form id="settings-form"><header><h2 data-t="settings">Configurações</h2><button type="button" data-close aria-label="Fechar" data-t-aria="close">×</button></header><label><span data-t="language">Idioma</span><select name="language" autofocus><option value="pt" lang="pt-BR">Português</option><option value="en" lang="en">English</option></select></label><label class="check"><input name="staySignedIn" type="checkbox"><span><span data-t="staySignedIn">Manter login</span><small data-t="staySignedInHelp">O Eclipse guarda a sessão de cada conta e entra sem digitar, em segundo plano. A Riot sempre abre na tela de login.</small></span></label><label class="check" id="start-with-windows" hidden><input name="startWithWindows" type="checkbox"><span><span data-t="startWithWindows">Iniciar com o Windows</span><small data-t="startWithWindowsHelp">O Eclipse abre na bandeja quando você entra no Windows, sem abrir a Riot.</small></span></label><label class="check"><input name="uiSounds" type="checkbox"><span><span data-t="uiSounds">Sons da interface</span><small data-t="uiSoundsHelp">Toca os sons do cliente do League ao passar o mouse e clicar. Os sons vêm da CommunityDragon na hora.</small></span></label><label><span data-t="refreshEvery">Atualizar a cada (minutos)</span><input name="refreshMinutes" type="number" min="0" max="10080"></label><p class="form-error" role="alert"></p><footer><button type="button" data-close data-t="cancel">Cancelar</button><button type="submit" class="primary" data-t="save">Salvar</button></footer></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><footer><button value="cancel" data-t="cancel">Cancelar</button><button value="confirm" class="primary" data-t="confirm">Confirmar</button></footer></form></dialog>
