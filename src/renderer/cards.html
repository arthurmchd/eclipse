<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://raw.communitydragon.org https://media.valorant-api.com; style-src 'self'; script-src 'self'; connect-src 'none'; font-src 'self'">
<title>Contas</title><link rel="stylesheet" href="../../node_modules/@fontsource/teko/500.css"><link rel="stylesheet" href="../../node_modules/@fontsource/teko/600.css"><link rel="stylesheet" href="cards.css"></head><body>
<section id="status" class="status" role="status" aria-live="polite" hidden><span class="spinner"></span><p id="status-text"></p></section><p id="notice" role="status" hidden></p><div id="toolbar" class="toolbar"><label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg><input id="search" type="search" maxlength="80" autocomplete="off" spellcheck="false" placeholder="Buscar por nome, etiqueta ou nota" aria-label="Buscar contas" data-t-placeholder="searchPlaceholder" data-t-aria="search"></label><select id="filter-region" aria-label="Filtrar por servidor" data-t-aria="filterRegion"></select><select id="filter-tier" aria-label="Filtrar por elo" data-t-aria="filterTier"></select><select id="filter-tag" aria-label="Filtrar por etiqueta" data-t-aria="filterTag"></select><select id="sort" aria-label="Ordenar" data-t-aria="sortLabel"></select></div><main id="cards" aria-label="Contas salvas" data-t-aria="savedAccounts"></main>
<footer class="launch-bar"><div class="footer-tools"><button id="add-account" type="button" title="Adicionar conta" aria-label="Adicionar conta" data-t-title="addAccount" data-t-aria="addAccount"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"/></svg></button><button id="settings" title="Configurações" aria-label="Configurações" data-t-title="settings" data-t-aria="settings">⚙</button><div id="layout" class="layout-toggle" role="group" aria-label="Visualização das contas" data-t-aria="layoutNav"><button type="button" data-layout="plates" aria-pressed="true" title="Placas" aria-label="Placas" data-t-title="layoutPlates" data-t-aria="layoutPlates"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="5" height="11" rx="1"/><rect x="9" y="2.5" width="5" height="11" rx="1"/></svg></button><button type="button" data-layout="list" aria-pressed="false" title="Lista compacta" aria-label="Lista compacta" data-t-title="layoutList" data-t-aria="layoutList"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button></div><p class="refresh-info"><span id="count">0 contas</span><span id="updated">nunca atualizado</span></p><button id="refresh" title="Atualizar estatísticas" aria-label="Atualizar estatísticas" data-t-title="refreshStats" data-t-aria="refreshStats">↻</button></div><nav id="games" aria-label="Jogo" data-t-aria="gamesNav"><button data-game="riot" aria-pressed="false" aria-label="Riot Client" title="Riot Client: só entrar na conta" data-t-title="riotOnly"><img src="assets/riot.png" alt=""></button><button data-game="lol" aria-pressed="true" aria-label="League of Legends" title="League of Legends"><img src="assets/lol.png" alt=""></button><button data-game="val" aria-pressed="false" aria-label="VALORANT" title="VALORANT"><img src="assets/valorant.png" alt=""></button></nav><div class="selection" aria-live="polite"><strong id="selected-name">Selecione uma conta</strong><span id="selected-game">League of Legends</span></div><button id="play" class="primary" disabled>Jogar <span aria-hidden="true">→</span></button></footer>
<div class="riot-controls"><button id="riot-minimize" class="riot-control" type="button" aria-label="Minimizar" data-t-aria="minimize"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M10 15.5h12"/></svg></button><button id="riot-close" class="riot-control riot-close" type="button" aria-label="Fechar" data-t-aria="close"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M11 7l10.5 10.5M21.5 7l-10.5 10.5"/></svg></button></div>
<dialog id="account-dialog" class="account-dialog"><form id="account-form"><header><h2 id="account-title">Adicionar conta</h2><button type="button" data-close aria-label="Fechar" data-t-aria="close">×</button></header><div id="add-mode" class="mode-tabs" role="group"><button type="button" data-mode="single" aria-pressed="true" data-t="addOne">Uma conta</button><button type="button" data-mode="batch" aria-pressed="false" data-t="addMany">Várias contas</button></div><button type="button" id="use-seen" class="use-seen" hidden></button><div class="form-grid"><label class="single-field"><span data-t="riotId">Nome da conta (Riot ID)</span><input name="riotId" required maxlength="81" placeholder="Nome#BR1" data-t-placeholder="riotIdPlaceholder"></label><label class="single-field"><span data-t="username">Usuário de login</span><input name="username" required maxlength="256" autocomplete="off"></label><label class="single-field"><span data-t="password">Senha</span><input name="password" type="password" maxlength="256" autocomplete="new-password" placeholder="Vazio para manter ao editar" data-t-placeholder="passwordPlaceholder"></label><label class="batch-field wide" hidden><span data-t="batchLabel">Uma conta por linha: Nome#TAG;usuário;senha</span><textarea name="batch" rows="6" maxlength="20000" spellcheck="false" autocomplete="off" placeholder="Nome#BR1;usuario;senha"></textarea><small data-t="batchHint">As senhas aparecem enquanto você digita e são apagadas ao fechar.</small></label><label><span data-t="region">Servidor</span><select name="region"></select></label><fieldset class="wide choices"><legend data-t="gamesLabel">Mostrar em</legend><label class="choice"><input type="radio" name="games" value="all" checked><span data-t="gamesAll">Todos os jogos</span></label><label class="choice"><input type="radio" name="games" value="lol"><span>League of Legends</span></label><label class="choice"><input type="radio" name="games" value="val"><span>VALORANT</span></label></fieldset><label class="wide"><span data-t="tagsLabel">Etiquetas</span><input name="tags" maxlength="200" autocomplete="off" placeholder="Main, Smurf, Duo" data-t-placeholder="tagsPlaceholder"></label><div id="tag-suggestions" class="wide tag-suggestions" role="group" aria-label="Etiquetas" data-t-aria="tagsLabel"></div><fieldset class="wide choices"><legend data-t="colorLabel">Cor do cartão</legend><div id="color-choices" class="swatches"></div></fieldset><label class="wide single-field"><span data-t="noteLabel">Notas</span><textarea name="note" rows="2" maxlength="500"></textarea></label></div><p class="form-error" role="alert"></p><footer><button type="button" id="delete-account" class="danger" data-t="removeAccount" hidden>Remover conta</button><button type="button" data-close data-t="cancel">Cancelar</button><button type="submit" class="primary" data-t="saveAccount">Salvar conta</button></footer></form></dialog>
<dialog id="settings-dialog"><form id="settings-form"><header><h2 data-t="settings">Configurações</h2><button type="button" data-close aria-label="Fechar" data-t-aria="close">×</button></header><label><span data-t="language">Idioma</span><select name="language"><option value="pt" lang="pt-BR">Português</option><option value="en" lang="en">English</option></select></label><label class="check"><input name="staySignedIn" type="checkbox"><span><span data-t="staySignedIn">Manter login</span><small data-t="staySignedInHelp">O Eclipse guarda a sessão de cada conta e entra sem digitar, em segundo plano. A Riot sempre abre na tela de login.</small></span></label><p data-t="keysHint">Chaves opcionais: sem elas, o elo vem do jogo aberto. Campos vazios mantêm a chave atual.</p><label>Riot API (League)<input name="riotApiKey" type="password" autocomplete="new-password"></label><label>HenrikDev (VALORANT)<input name="henrikApiKey" type="password" autocomplete="new-password"></label><label><span data-t="refreshEvery">Atualizar a cada (minutos)</span><input name="refreshMinutes" type="number" min="0" max="10080"></label><p class="form-error" role="alert"></p><footer><button type="button" data-close data-t="cancel">Cancelar</button><button type="submit" class="primary" data-t="save">Salvar</button></footer></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><footer><button value="cancel" data-t="cancel">Cancelar</button><button value="confirm" class="primary" data-t="confirm">Confirmar</button></footer></form></dialog>
<script type="module" src="cards.js"></script></body></html>
